<div class="console-head">
  <div class="eyebrow"><a href="{{ event.get_absolute_url }}">{{ event.name }}</a> · organizer console</div>
  <span class="badge {% if event.phase == 'submissions' %}ok{% elif event.phase == 'judging' %}warn{% elif event.phase == 'results' %}{% else %}neutral{% endif %}">{{ event.phase|title }}</span>
</div>
<nav class="subnav" aria-label="Organizer console">
  <a class="{% if on == 'dashboard' %}on{% endif %}"{% if on == 'dashboard' %} aria-current="page"{% endif %} href="{% url 'organize_dashboard' event.slug %}">Overview</a>
  <a class="{% if on == 'projects' %}on{% endif %}"{% if on == 'projects' %} aria-current="page"{% endif %} href="{% url 'organize_projects' event.slug %}">Projects</a>
  <a class="{% if on == 'judges' %}on{% endif %}"{% if on == 'judges' %} aria-current="page"{% endif %} href="{% url 'organize_judges' event.slug %}">Judges</a>
  <a class="{% if on == 'rubric' %}on{% endif %}"{% if on == 'rubric' %} aria-current="page"{% endif %} href="{% url 'organize_rubric' event.slug %}">Rubric</a>
  <a class="{% if on == 'assignments' %}on{% endif %}"{% if on == 'assignments' %} aria-current="page"{% endif %} href="{% url 'organize_assignments' event.slug %}">Assignments</a>
  <a class="{% if on == 'results' %}on{% endif %}"{% if on == 'results' %} aria-current="page"{% endif %} href="{% url 'organize_results' event.slug %}">Results</a>
  <a class="{% if on == 'voting' %}on{% endif %}"{% if on == 'voting' %} aria-current="page"{% endif %} href="{% url 'organize_voting' event.slug %}">Voting</a>
  <a class="{% if on == 'integrations' %}on{% endif %}"{% if on == 'integrations' %} aria-current="page"{% endif %} href="{% url 'organize_integrations' event.slug %}">Integrations</a>
  <a class="{% if on == 'audit' %}on{% endif %}"{% if on == 'audit' %} aria-current="page"{% endif %} href="{% url 'organize_audit' event.slug %}">Audit log</a>
  <a class="{% if on == 'settings' %}on{% endif %}"{% if on == 'settings' %} aria-current="page"{% endif %} href="{% url 'organize_settings' event.slug %}">Settings</a>
</nav>
