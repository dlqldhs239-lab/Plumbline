name: plumbline

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plumbline
      POSTGRES_USER: plumbline
      POSTGRES_PASSWORD: plumbline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumbline -d plumbline"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: .
    ports:
      - "${PLUMBLINE_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://plumbline:plumbline@db:5432/plumbline
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me-in-production}
      PLUMBLINE_SEED_SECRET: ${PLUMBLINE_SEED_SECRET:-dev-seed-secret}
      PLUMBLINE_SEED: ${PLUMBLINE_SEED:-1}
      PLUMBLINE_SEED_PUBLISH: ${PLUMBLINE_SEED_PUBLISH:-1}
      PLUMBLINE_FIXTURES: /app/fixtures.json
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      PLUMBLINE_SITE_NAME: ${PLUMBLINE_SITE_NAME:-Plumbline}
      PLUMBLINE_SITE_URL: ${PLUMBLINE_SITE_URL:-}
      PLUMBLINE_ANON_WRITE_RATE: ${PLUMBLINE_ANON_WRITE_RATE:-20}
      PLUMBLINE_TRUST_PROXY: ${PLUMBLINE_TRUST_PROXY:-0}
      PLUMBLINE_WEBHOOK_ALLOW_PRIVATE: ${PLUMBLINE_WEBHOOK_ALLOW_PRIVATE:-0}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
